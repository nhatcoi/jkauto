schemaVersion: 1
id: tc_ecm_folder_create
name: Folder - Create New
platform: web
runner: playwright
variables:
  username: admin
  password: Admin@123
  folderName: Automated Folder
steps:
  - id: open_app
    keyword: navigate-to
    input: http://localhost:5174
  - id: wait_login_form
    keyword: wait-for-element
    objectRef: "#username"
  - id: enter_username
    keyword: type-text
    objectRef: "#username"
    input: "{{username}}"
  - id: enter_password
    keyword: type-text
    objectRef: "#password"
    input: "{{password}}"
  - id: submit_login
    keyword: click
    objectRef: "#login-btn"
  - id: wait_dashboard
    keyword: wait-for-element
    objectRef: 'text="Dashboard"'
  - id: click_folders_nav
    keyword: click
    objectRef: 'text="Folders"'
  - id: wait_folders_page
    keyword: wait-for-element
    objectRef: "#new-fld-btn"
  - id: click_new_folder
    keyword: click
    objectRef: "#new-fld-btn"
  - id: wait_modal_form
    keyword: wait-for-element
    objectRef: "#fld-name"
  - id: enter_folder_name
    keyword: type-text
    objectRef: "#fld-name"
    input: "{{folderName}}"
  - id: submit_create_folder
    keyword: click
    objectRef: "#fld-submit-btn"
  - id: wait_folder_in_list
    keyword: wait-for-element
    objectRef: 'text="Automated Folder"'
  - id: assert_folder_name
    keyword: assert-text
    objectRef: 'text="Automated Folder"'
    expected: "{{folderName}}"
