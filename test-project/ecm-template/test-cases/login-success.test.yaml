schemaVersion: 1
id: tc_ecm_login_success
name: Login ECM - Success
platform: web
runner: playwright
variables:
  username: admin
  password: Admin@123
steps:
  - id: open_app
    keyword: navigate-to
    input: http://localhost:5174
  - id: wait_login_form
    keyword: wait-for-element
    objectRef: "#username"
  - id: enter_username
    keyword: type-text
    objectRef: "#username"
    input: "{{username}}"
  - id: enter_password
    keyword: type-text
    objectRef: "#password"
    input: "{{password}}"
  - id: submit_login
    keyword: click
    objectRef: "#login-btn"
  - id: wait_dashboard
    keyword: wait-for-element
    objectRef: 'text="Dashboard"'
  - id: assert_welcome_back
    keyword: assert-text
    objectRef: 'text="Welcome back,"'
    expected: "Welcome back, {{username}}"
