schemaVersion: 1
id: tc_ecm_document_create
name: Document - Create New
platform: web
runner: playwright
variables:
  username: admin
  password: Admin@123
  docTitle: Automated Test Doc
  docDesc: Created by jkauto automation script.
steps:
  - id: open_app
    keyword: navigate-to
    input: http://localhost:5174
  - id: wait_login_form
    keyword: wait-for-element
    objectRef: "#username"
  - id: enter_username
    keyword: type-text
    objectRef: "#username"
    input: "{{username}}"
  - id: enter_password
    keyword: type-text
    objectRef: "#password"
    input: "{{password}}"
  - id: submit_login
    keyword: click
    objectRef: "#login-btn"
  - id: wait_dashboard
    keyword: wait-for-element
    objectRef: 'text="Dashboard"'
  - id: click_documents_nav
    keyword: click
    objectRef: 'text="Documents"'
  - id: wait_documents_page
    keyword: wait-for-element
    objectRef: "#new-doc-btn"
  - id: click_new_document
    keyword: click
    objectRef: "#new-doc-btn"
  - id: wait_modal_form
    keyword: wait-for-element
    objectRef: "#doc-title"
  - id: enter_doc_title
    keyword: type-text
    objectRef: "#doc-title"
    input: "{{docTitle}}"
  - id: enter_doc_desc
    keyword: type-text
    objectRef: "#doc-desc"
    input: "{{docDesc}}"
  - id: submit_create_doc
    keyword: click
    objectRef: "#doc-submit-btn"
  - id: wait_doc_in_list
    keyword: wait-for-element
    objectRef: 'text="Automated Test Doc"'
  - id: assert_doc_title
    keyword: assert-text
    objectRef: 'text="Automated Test Doc"'
    expected: "{{docTitle}}"
