    objectRef: ~login-email-input
    input: ""
    expected: ""
    enabled: true
    continueOnFailure: false
    timeout: null
  - id: s03
    keyword: type-text
    description: Enter email
    objectRef: ~login-email-input
    input: "{{email}}"
    expected: ""
    enabled: true
    continueOnFailure: false
    timeout: null
  - id: s04
    keyword: clear-text
    description: Clear password field
    objectRef: ~login-password-input
    input: ""
    expected: ""
    enabled: true
    continueOnFailure: false
    timeout: null
  - id: s05
    keyword: type-text
    description: Enter password
    objectRef: ~login-password-input
    input: "{{password}}"
    expected: ""
    enabled: true
    continueOnFailure: false
