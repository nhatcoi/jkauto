    keyword: assert-visible
    description: Assert tasks screen visible
    objectRef: ~tasks-screen
    input: ""
    expected: ""
    enabled: true
    continueOnFailure: false
    timeout: null
  - id: s09
    keyword: assert-visible
    description: Assert signed-in email element visible
    objectRef: ~signed-in-email-text
    input: ""
    expected: ""
    enabled: true
    continueOnFailure: false
    timeout: null
  - id: s10
    keyword: assert-text
    description: Assert email text matches
    objectRef: ~signed-in-email-text
    input: ""
