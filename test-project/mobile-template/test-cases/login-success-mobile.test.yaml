    keyword: mobile.launchApp
    description: Launch app with clear state
    objectRef: ""
    input: clearState
    expected: ""
    enabled: true
    continueOnFailure: false
    timeout: null
  - id: s01
    keyword: wait-for-element
    description: Wait for login screen ready
    objectRef: ~login-email-input
    input: "15000"
    expected: ""
    enabled: true
    continueOnFailure: false
    timeout: null
