schemaVersion: 1
id: tc-mobile-login-success
name: Login Mobile - Success
description: Login with valid credentials, verify tasks screen and signed-in email
platform: appium
runner: appium
tags:
  - login
  - smoke
app:
  id: com.anonymous.mobiletemplate
variables:
  email: tester@example.com
  password: password123
stepDelayMs: null
steps:
