schemaVersion: 1
id: a1b2c3d4-e5f6-7890-abcd-ef1234567805
name: Tags CRUD Lifecycle
description: Create tag -> get all -> get by ID -> update -> delete
tags:
  - api
  - tags
  - crud
platform: api
runner: api
variables:
  TAG_NAME: Test Tag Auto
  TAG_NAME_UPDATED: Test Tag Auto (Updated)
  TAG_COLOR: "#123456"
  TAG_COLOR_UPDATED: "#654321"
steps:
  - id: s1
    keyword: http-request-body
    description: POST /tags — create tag
    objectRef: POST
    input: /tags
    expected: '{"name":"{{TAG_NAME}}","color":"{{TAG_COLOR}}"}'
  - id: s2
    keyword: assert-status-code
    description: Expect 201 Created
    expected: "201"
  - id: s3
    keyword: assert-response-contains
    description: Response contains tag ID
    expected: id
  - id: s4
    keyword: extract-body
    description: Extract tag ID
    objectRef: $.id
    input: tagId
  - id: s5
    keyword: http-request
    description: GET /tags — list all tags
    objectRef: GET
    input: /tags
  - id: s6
    keyword: assert-status-code
    description: Expect 200 OK
    expected: "200"
  - id: s7
    keyword: assert-response-contains
    description: List contains created tag
    expected: "{{TAG_NAME}}"
  - id: s8
    keyword: http-request
    description: GET /tags/:id — get tag details
    objectRef: GET
    input: /tags/{{tagId}}
  - id: s9
    keyword: assert-status-code
    description: Expect 200 OK
    expected: "200"
  - id: s10
    keyword: assert-json-path
    description: Verify tag name
    objectRef: name
    expected: "{{TAG_NAME}}"
  - id: s11
    keyword: http-request-body
    description: PUT /tags/:id — update tag name and color
    objectRef: PUT
    input: /tags/{{tagId}}
    expected: '{"name":"{{TAG_NAME_UPDATED}}","color":"{{TAG_COLOR_UPDATED}}"}'
  - id: s12
    keyword: assert-status-code
    description: Expect 200 OK after update
    expected: "200"
  - id: s13
    keyword: assert-json-path
    description: Verify updated tag name
    objectRef: name
    expected: "{{TAG_NAME_UPDATED}}"
  - id: s14
    keyword: assert-json-path
    description: Verify updated tag color
    objectRef: color
    expected: "{{TAG_COLOR_UPDATED}}"
  - id: s15
    keyword: http-request
    description: DELETE /tags/:id — delete tag
    objectRef: DELETE
    input: /tags/{{tagId}}
  - id: s16
    keyword: assert-status-code
    description: Expect 200 OK after deletion
    expected: "200"
  - id: s17
    keyword: log-response
    description: Log delete response
    continueOnFailure: true
createdAt: "2026-06-25T11:45:00.000Z"
updatedAt: "2026-06-25T11:45:00.000Z"
