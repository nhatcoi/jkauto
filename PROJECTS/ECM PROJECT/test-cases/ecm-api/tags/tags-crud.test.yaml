schemaVersion: 1
id: a1b2c3d4-e5f6-7890-abcd-ef1234567805
name: Tags CRUD Lifecycle
description: Create tag → list → verify → rename → delete
tags:
  - api
  - tags
  - crud
platform: api
runner: api
variables:
  TAG_NAME: Test Tag Auto
  TAG_NAME_UPDATED: Test Tag Auto (Updated)
  TAG_COLOR: "#3182CE"
  TAG_COLOR_UPDATED: "#E53E3E"
steps:
  - id: s1
    keyword: http-request-body
    description: POST /tags — create test tag
    objectRef: POST
    input: /tags
    expected: '{"name":"{{TAG_NAME}}","color":"{{TAG_COLOR}}"}'
  - id: s5
    keyword: assert-status-code
    description: Expect 200/201 Created
    expected: "201"
  - id: s6
    keyword: assert-response-contains
    description: Response contains tag id
    expected: id
  - id: s7
    keyword: extract-body
    description: Extract tag id
    objectRef: $.id
    input: tagId
  - id: s8
    keyword: http-request
    description: GET /tags — list all tags
    objectRef: GET
    input: /tags
  - id: s9
    keyword: assert-status-code
    description: Expect 200 OK
    expected: "200"
  - id: s10
    keyword: assert-response-contains
    description: List contains created tag name
    expected: "{{TAG_NAME}}"
  - id: s11
    keyword: http-request-body
    description: PUT /tags/:id — rename and recolor
    objectRef: PUT
    input: /tags/{{tagId}}
    expected: '{"name":"{{TAG_NAME_UPDATED}}","color":"{{TAG_COLOR_UPDATED}}"}'
  - id: s12
    keyword: assert-status-code
    description: Expect 200 OK after update
    expected: "200"
  - id: s13
    keyword: assert-response-contains
    description: Response reflects updated name
    expected: "{{TAG_NAME_UPDATED}}"
  - id: s14
    keyword: http-request
    description: DELETE /tags/:id
    objectRef: DELETE
    input: /tags/{{tagId}}
  - id: s15
    keyword: assert-status-code
    description: Expect 200 OK after delete
    expected: "200"
  - id: s16
    keyword: log-response
    description: Log delete response
    continueOnFailure: true
