schemaVersion: 1
id: a1b2c3d4-e5f6-7890-abcd-ef1234567806
name: Users Management
description: List all users (admin), get user by ID, verify own user profile
tags:
  - api
  - users
  - admin
  - smoke
platform: api
runner: api
steps:
  - id: s1
    keyword: http-request
    description: GET /users — list all users (admin only)
    objectRef: GET
    input: /users
  - id: s4
    keyword: assert-status-code
    description: Expect 200 OK
    expected: "200"
  - id: s5
    keyword: assert-response-time
    description: Response under 2000ms
    expected: "2000"
  - id: s6
    keyword: assert-response-contains
    description: List contains admin user
    expected: admin
  - id: s7
    keyword: http-request
    description: GET /users/:id — get own user by saved userId
    objectRef: GET
    input: /users/{{userId}}
  - id: s8
    keyword: assert-status-code
    description: Expect 200 OK
    expected: "200"
  - id: s9
    keyword: assert-json-path
    description: Verify username is admin
    objectRef: username
    expected: admin
  - id: s10
    keyword: assert-json-path
    description: Verify role is admin
    objectRef: role
    expected: admin
  - id: s11
    keyword: assert-response-contains
    description: Response contains email field
    expected: email
  - id: s12
    keyword: log-response
    description: Log user detail response
    continueOnFailure: true
