schemaVersion: 1
id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
name: JSONPlaceholder - User CRUD flow
description: GET users, create post, verify response chain
tags:
  - api
  - smoke
  - jsonplaceholder
platform: api
runner: api
variables:
  BASE_URL: https://jsonplaceholder.typicode.com
steps:
  - id: s1
    keyword: set-base-url
    description: Set base URL from variable
    input: ${BASE_URL}
  - id: s2
    keyword: set-request-header
    description: Set content type
    objectRef: Content-Type
    input: application/json
  - id: s3
    keyword: http-request
    description: GET list of users
    objectRef: GET
    input: /users
  - id: s4
    keyword: assert-status-code
    description: Verify 200 OK
    expected: "200"
  - id: s5
    keyword: assert-header
    description: Response is JSON
    objectRef: content-type
    expected: application/json
  - id: s6
    keyword: assert-json-path
    description: First user has id=1
    objectRef: 0.id
    expected: "1"
  - id: s7
    keyword: extract-body
    description: Extract first user id
    objectRef: $.0.id
    input: userId
  - id: s8
    keyword: http-request-body
    description: Create a post for extracted user
    objectRef: POST
    input: /posts
    expected: |
      {"title":"Smoke test post","body":"auto generated","userId":{{userId}}}
  - id: s9
    keyword: assert-status-code
    description: Verify 201 Created
    expected: "201"
  - id: s10
    keyword: assert-json-path
    description: Response has title
    objectRef: title
    expected: Smoke test post
  - id: s11
    keyword: assert-response-time
    description: Under 3s
    expected: "3000"
  - id: f032b0ff-01aa-47de-b509-bb0610fb16b6
    keyword: http-request
