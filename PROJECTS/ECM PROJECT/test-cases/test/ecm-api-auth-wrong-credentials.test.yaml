schemaVersion: 1
id: b333e19d-2a51-4b20-9a35-07f287f8a288
name: ECM API Auth Wrong Credentials
description: Login known admin with wrong password; expect 401 and no token.
tags:
  - api
  - auth
  - negative
platform: api
runner: api
steps:
  - id: 35d0ca6b-463d-4210-b475-01f34f31a089
    keyword: set-base-url
    description: Base URL
    input: http://localhost:3001
  - id: 5b73112c-a7fe-426d-90bf-a791de4848d9
    keyword: http-request
    description: Login with wrong password for seeded admin
    objectRef: POST
    input: /auth/login
    expected: '{"username":"admin","password":"Wrong@123"}'
  - id: 77e7ad03-4637-4698-9811-87a99b38506e
    keyword: assert-status-code
    description: Expect unauthorized
    expected: "401"
  - id: d6261f46-2803-4e58-8af4-dbb4e780d18e
    keyword: assert-response-contains
    description: No token issued, error response returned
    expected: Invalid
