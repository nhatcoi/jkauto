schemaVersion: 1
id: 2260e43a-dd44-4d19-9560-2ea80821fb32
name: ECM API Users Invalid Email
description: Login admin, get current user id, update email with invalid format, expect 400.
tags:
  - api
  - users
  - negative
platform: api
runner: api
steps:
  - id: 599f09dc-3d66-4ac1-8b64-eb83def10146
    keyword: set-base-url
    description: Base URL
    input: http://localhost:3001
  - id: b0cf184e-be01-41f7-906e-45d8094bb5e3
    keyword: http-request
    description: Login admin
    objectRef: POST
    input: /auth/login
    expected: '{"username":"admin","password":"Admin@123"}'
  - id: 3acfb2ab-299c-4aa4-895c-614ade02fbe4
    keyword: assert-status-code
    description: Login success
    expected: "200"
  - id: 7acb8829-1087-4c0d-8acd-4ae121f7fd78
    keyword: set-variable
    description: Store access token
    objectRef: accessToken
    expected: accessToken
  - id: 6917d1e7-1882-473f-b57a-57173eceb61e
    keyword: set-auth-bearer
    description: Use access token
    input: ${accessToken}
  - id: ed60f5bc-4229-4560-9bdb-acad4edc949a
    keyword: http-request
    description: Update user with invalid email
    objectRef: PUT
    input: /users/1
    expected: '{"email":"not-an-email"}'
  - id: dbbaf590-bd4d-4f51-9291-ccea3290193d
    keyword: assert-status-code
    description: Invalid email rejected
    expected: "400"
