schemaVersion: 1
id: 3277a78e-ef38-4fbb-b6ff-f8ca26509569
name: ECM API Users Happy
description: Login admin and list users.
tags:
  - api
  - users
  - happy
platform: api
runner: api
steps:
  - id: c563dc89-6f46-431a-ac74-fac18f47f7a7
    keyword: set-base-url
    description: Base URL
    input: http://localhost:3001
  - id: 5085eaa7-eea9-4dcb-92eb-bfb871ea18a4
    keyword: http-request
    description: Login admin
    objectRef: POST
    input: /auth/login
    expected: '{"username":"admin","password":"Admin@123"}'
  - id: a0db5dd7-fb70-4fc5-b699-9b51c0930941
    keyword: assert-status-code
    description: Login success
    expected: "200"
  - id: fd762661-b2ff-46f9-881d-86ac0953bbf1
    keyword: set-variable
    description: Store access token
    objectRef: accessToken
    expected: accessToken
  - id: 5c1cbb2a-b8d5-4cb9-896c-647f92078444
    keyword: set-auth-bearer
    description: Use access token
    input: ${accessToken}
  - id: 8868c97c-44a7-4f0d-9161-530c3c5c454f
    keyword: http-request
    description: List users
    objectRef: GET
    input: /users
  - id: 5370d98a-e40f-4d16-9605-6d403e5c9166
    keyword: assert-status-code
    description: Users list success
    expected: "200"
  - id: fdedf9f2-88f1-41c9-a7ea-679ba45e4573
    keyword: assert-response-contains
    description: Admin user present
    expected: admin
