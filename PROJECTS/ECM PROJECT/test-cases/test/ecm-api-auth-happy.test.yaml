schemaVersion: 1
id: caee538b-fd99-4fb5-9682-b61f314bd7b9
name: ECM API Auth Happy
description: Login seeded admin, verify token, call /auth/me.
tags:
  - api
  - auth
  - happy
platform: api
runner: api
steps:
  - id: 91849fb3-0142-4558-a6f7-5bc86033d9fd
    keyword: set-base-url
    description: Base URL
    input: http://localhost:3001
  - id: 522e94bc-ce97-44f5-85ee-3a006905d991
    keyword: http-request
    description: Login with seeded admin
    objectRef: POST
    input: /auth/login
    expected: '{"username":"admin","password":"Admin@123"}'
  - id: c5e4a4f8-67e6-470f-ba6d-005a24050142
    keyword: assert-status-code
    description: Login success
    expected: "200"
  - id: b4472715-d6e0-4181-8a2a-19ea217080fc
    keyword: assert-json-path
    description: Access token returned
    objectRef: accessToken
    expected: "*"
  - id: 468ec196-6616-48b8-83cd-8b0c49917bd0
    keyword: assert-json-path
    description: Refresh token returned
    objectRef: refreshToken
    expected: "*"
  - id: 1bee050c-75a3-4b4d-9812-359412d060a5
    keyword: set-variable
    description: Store access token
    objectRef: accessToken
    expected: accessToken
  - id: c44c4d0a-1554-4e3b-8368-29360ed54687
    keyword: set-variable
    description: Store refresh token
    objectRef: refreshToken
    expected: refreshToken
  - id: 331415dc-8226-42aa-b2de-166716c5a5b8
    keyword: set-auth-bearer
    description: Use access token
    input: ${accessToken}
  - id: dfd8f3cd-895a-4246-a3f6-75c911825f34
    keyword: http-request
    description: Get current user
    objectRef: GET
    input: /auth/me
  - id: 319f4299-a1e8-4c9e-9e73-ec1b2cde526d
    keyword: assert-status-code
    description: Current user success
    expected: "200"
  - id: 71729903-c805-4e52-8da7-49645af711c4
    keyword: assert-response-contains
    description: Admin username present
    expected: admin
  - id: b4181594-a2b4-421a-ae57-1b2a5f1f4030
    keyword: http-request
    description: Refresh access token
    objectRef: POST
    input: /auth/refresh
    expected: '{"refreshToken":"${refreshToken}"}'
  - id: 835b972c-0023-49c6-8f35-2858a7986698
    keyword: assert-status-code
    description: Refresh success
    expected: "200"
