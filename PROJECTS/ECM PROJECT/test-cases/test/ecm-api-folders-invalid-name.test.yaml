schemaVersion: 1
id: be95cdf4-b682-4d5b-af08-b2fa14b38857
name: ECM API Folders Invalid Name
description: Create folder with invalid empty name; expect 400.
tags:
  - api
  - folders
  - negative
platform: api
runner: api
steps:
  - id: e5183c36-b92a-4c4a-a257-35fe74dfd771
    keyword: set-base-url
    description: Base URL
    input: http://localhost:3001
  - id: c05c9353-1f9e-4ba0-9492-3a33aa5602c3
    keyword: http-request
    description: Login seeded admin
    objectRef: POST
    input: /auth/login
    expected: '{"username":"admin","password":"Admin@123"}'
  - id: 535f84e3-cdda-4829-bc1c-c74437efcb15
    keyword: assert-status-code
    description: Expect login success
    expected: "200"
  - id: 9719c620-412b-4bf7-8172-edf0eb2dad4b
    keyword: set-variable
    description: Store access token
    objectRef: accessToken
    expected: accessToken
  - id: 239f5ec4-314b-482e-beda-0d003ec8d977
    keyword: set-auth-bearer
    description: Use access token
    input: ${accessToken}
  - id: 0ee725fc-07f8-4449-8a15-2532932d027a
    keyword: http-request
    description: Create folder with invalid empty name
    objectRef: POST
    input: /folders
    expected: '{"name":""}'
  - id: bbf984f5-9332-41b8-a04f-97bfa95e5395
    keyword: assert-status-code
    description: Expect validation error
    expected: "400"
