schemaVersion: 1
id: afd459d9-f11b-4ab6-a374-d36dd5cbcfdb
name: ECM API Tags Invalid Name
description: Create tag with invalid empty name; expect 400.
tags:
  - api
  - tags
  - negative
platform: api
runner: api
steps:
  - id: 5cd27b38-0ece-46a4-8cdb-d86add88666f
    keyword: set-base-url
    description: Base URL
    input: http://localhost:3001
  - id: 937e4524-328d-49f7-8e3a-ea55a6d52ab9
    keyword: http-request
    description: Login seeded admin
    objectRef: POST
    input: /auth/login
    expected: '{"username":"admin","password":"Admin@123"}'
  - id: 95ff10fb-ca83-47ee-a698-84219614c63e
    keyword: assert-status-code
    description: Expect login success
    expected: "200"
  - id: ca063f90-ddc3-4995-8f12-f1299838f029
    keyword: set-variable
    description: Store access token
    objectRef: accessToken
    expected: accessToken
  - id: bc42b0a0-e141-48c0-831a-f5e68108676e
    keyword: set-auth-bearer
    description: Use access token
    input: ${accessToken}
  - id: b9b21947-c109-4279-b48f-a1ca31449154
    keyword: http-request
    description: Create tag with invalid empty name
    objectRef: POST
    input: /tags
    expected: '{"name":""}'
  - id: 3ca4a492-d367-4199-bd11-81707690f944
    keyword: assert-status-code
    description: Expect validation error
    expected: "400"
