schemaVersion: 1
id: 4a4e3cb3-9385-4ee0-ade3-050237a4ec8b
name: ECM API Search Happy
description: Login as admin and search documents/folders.
tags:
  - api
  - search
  - happy
platform: api
runner: api
steps:
  - id: 8df5377a-c5e8-4bb8-9f3a-e4f5558bf003
    keyword: set-base-url
    description: Base URL
    input: http://localhost:3001
  - id: 2b536a58-1e17-4f97-bdb9-7ee66104c58a
    keyword: http-request
    description: Login seeded admin
    objectRef: POST
    input: /auth/login
    expected: '{"username":"admin","password":"Admin@123"}'
  - id: fcd90c2e-a738-428c-b625-01474fc78860
    keyword: assert-status-code
    description: Expect login success
    expected: "200"
  - id: ce902885-a6ef-4a88-8415-52ccf128a7e1
    keyword: set-variable
    description: Store access token
    objectRef: accessToken
    expected: accessToken
  - id: 8d1ff2de-3cb9-467e-9c0f-e6eac77945e7
    keyword: set-auth-bearer
    description: Use access token
    input: ${accessToken}
  - id: af51c53d-1cb0-46b3-bc96-299003a94124
    keyword: http-request
    description: Search documents and folders
    objectRef: GET
    input: /search?q=test
  - id: 1ff09602-e03e-452c-8abc-eedc8206ada2
    keyword: assert-status-code
    description: Expect search success
    expected: "200"
  - id: 0c24b3c2-63e1-492a-9fa3-6db7c8858739
    keyword: http-request
    description: Get search suggestions
    objectRef: GET
    input: /search/suggestions?q=test
  - id: 624264a2-920f-4fd9-bf12-c15277f3a97c
    keyword: assert-status-code
    description: Expect suggestions success
    expected: "200"
