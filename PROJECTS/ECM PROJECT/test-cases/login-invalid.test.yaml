schemaVersion: 1
id: b2c3d4e5-f6a7-8901-bcde-f23456789012
name: Login - Invalid Credentials
description: POST /auth/login with wrong password → expect 400
tags:
  - api
  - auth
  - negative
platform: api
runner: api
variables:
  BASE_URL: http://localhost:3001
steps:
  - id: s1
    keyword: set-base-url
    description: Set API base URL
    input: "{{BASE_URL}}"
  - id: s2
    keyword: set-request-header
    description: Set Content-Type to JSON
    objectRef: Content-Type
    input: application/json
  - id: s3
    keyword: http-request-body
    description: POST /auth/login with wrong password
    objectRef: POST
    input: /auth/login
    expected: |
      {"username":"admin","password":"wrong_password"}
    continueOnFailure: true
  - id: s4
    keyword: assert-status-code
    description: Verify 400 Bad Request
    expected: "400"
  - id: s5
    keyword: assert-response-time
    description: Error response under 1000ms
    expected: "1000"
    continueOnFailure: true
  - id: s6
    keyword: log-response
    description: Log error response for debug
    continueOnFailure: true
