schemaVersion: 1
id: 49018cf0-de5c-4b5e-8cbf-a4a8966a0b62
name: TC - Checkout
runner: playwright
steps:
  - id: 0c2cc158-b4cf-4dec-9b8e-48f45eb7d14d
    keyword: navigate-to
    description: Go to login page
    input: http://localhost:5173/login
  - id: ae002f5f-8c16-4df1-862d-da7a0fae5723
    keyword: wait-for-visible
    description: Wait for username field
    objectRef: "#username"
    timeout: 10000
  - id: 2716aa55-10fd-42c7-9f60-9f726ef6f0e7
    keyword: type-text
    description: Enter username
    objectRef: "#username"
    input: ${username}
  - id: 84b0bede-6c8b-42aa-af5b-e6ef49b4d47e
    keyword: type-text
    description: Enter password
    objectRef: "#password"
    input: ${password}
  - id: 6f617b60-fff5-410f-a0d6-18c70419d729
    keyword: click
    description: Submit login
    objectRef: button[type="submit"]
  - id: b77fdbf0-d8a4-4155-b210-0c90c14ae51a
    keyword: wait-for-visible
    description: Wait for dashboard
    objectRef: text=Dashboard
    timeout: 10000
  - id: 1cd24051-8211-4fca-a86e-1573b2050504
    keyword: assert-url-contains
    description: Verify redirected to dashboard
    expected: /dashboard
  - id: 104dbb7c-9557-4859-8024-ea3591075c9d
    keyword: assert-visible
    description: Verify dashboard visible
    objectRef: text=Dashboard
