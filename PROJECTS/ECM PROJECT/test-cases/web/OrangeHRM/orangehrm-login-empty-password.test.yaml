schemaVersion: 1
id: 53422235-0cdd-4289-af4d-67205ba767b1
name: OrangeHRM Login - Empty Password
description: Verify validation message when Login submitted with username and
  empty password.
runner: playwright
steps:
  - id: 007bbe76-f071-4713-8bd1-4357b61c4d02
    keyword: navigate-to
    description: Open OrangeHRM login page
    input: https://opensource-demo.orangehrmlive.com/web/index.php/auth/login
  - id: 61aaeb4e-5e55-4682-a889-62706c1ddd13
    keyword: wait-for-visible
    description: Login form visible
    objectRef: form.oxd-form
    timeout: 15000
  - id: b99cf000-f558-46c8-89d6-421864d1038c
    keyword: type-text
    description: Enter valid username
    objectRef: input[name='username']
    input: Admin
  - id: 20f68d56-f422-4e64-98d8-fdec701e687c
    keyword: click
    description: Submit without password
    objectRef: button[type='submit']
  - id: 2b4c34b9-c6ad-4b01-aad5-fd31ec042326
    keyword: assert-text
    description: Password required message visible
    objectRef: //input[@name='password']/ancestor::div[contains(@class,'oxd-input-group')]//span[contains(@class,'oxd-input-field-error-message')]
    expected: Required
  - id: 22c7e9fb-c2dd-4593-9664-f45e8695cad8
    keyword: assert-url-contains
    description: User stays on login page
    input: /web/index.php/auth/login
