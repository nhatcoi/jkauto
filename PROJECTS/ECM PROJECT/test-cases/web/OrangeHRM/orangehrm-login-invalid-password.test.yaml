schemaVersion: 1
id: 4a862d0a-7c98-4711-9014-ccf9fc40ca27
name: OrangeHRM Login - Invalid Password
description: Verify login fails when username valid and password invalid.
runner: playwright
steps:
  - id: 1a173d22-9cf1-4e24-a85c-af8a880dc240
    keyword: navigate-to
    description: Mở trang Login OrangeHRM
    input: https://opensource-demo.orangehrmlive.com
  - id: 74a0befc-f38c-4919-840f-56b854030bfd
    keyword: wait-for-visible
    description: Chờ form Login hiển thị
    objectRef: input[name='username']
    timeout: 15000
  - id: 7a255f90-8a77-4148-bc4e-5e6bcc69b46b
    keyword: type-text
    description: Nhập username hợp lệ
    objectRef: input[name='username']
    input: Admin
  - id: 717e3c7a-1b0a-40bb-a584-c41c743da98a
    keyword: type-text
    description: Nhập password sai
    objectRef: input[name='password']
    input: WrongPassword123
  - id: c5748f5e-ec4c-4491-adb1-95736926fe3c
    keyword: click
    description: Bấm nút Login
    objectRef: button[type='submit']
  - id: 44a76ab1-8327-41d1-ba19-56c1eadf5fd3
    keyword: assert-visible
    description: Thông báo lỗi hiển thị
    objectRef: .oxd-alert-content-text
    expected: Invalid credentials
  - id: e6c0d619-be4b-4d29-8a78-c5a62e3cfd25
    keyword: assert-text
    description: Nội dung lỗi đúng
    objectRef: .oxd-alert-content-text
    expected: Invalid credentials
