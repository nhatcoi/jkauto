schemaVersion: 1
id: ef4dba66-9d7a-4b18-b057-e21ab466d70a
name: OrangeHRM Login - Valid Credentials
description: Verify user can log in to OrangeHRM demo with valid username and password.
runner: playwright
steps:
  - id: 9bcae6a8-58aa-4963-9e6c-63fcecb22e7c
    keyword: navigate-to
    description: Open OrangeHRM login page
    input: https://opensource-demo.orangehrmlive.com/web/index.php/auth/login
  - id: 2a2f4fe1-e6f8-4455-ae48-f9a03f082933
    keyword: wait-for-visible
    description: Login form visible
    objectRef: form.oxd-form
    timeout: 15000
  - id: 7bc29c1f-12dd-43c0-bf06-2cad1fdc8ea1
    keyword: assert-visible
    description: Username field visible
    objectRef: input[name='username']
  - id: a3a8f153-ce3e-467b-82ea-04d0261f40dc
    keyword: assert-visible
    description: Password field visible
    objectRef: input[name='password']
  - id: 0a228f61-97a9-44bd-9b62-6401a8aef04b
    keyword: assert-visible
    description: Login button visible
    objectRef: button[type='submit']
  - id: 4d58c797-928b-476b-ba0d-cbaeba659fbd
    keyword: assert-text
    description: Username hint visible
    objectRef: "p.oxd-text:has-text('Username : Admin')"
    expected: "Username : Admin"
  - id: 8af5a4f3-cd78-450f-8651-200f0ca2adb9
    keyword: assert-text
    description: Password hint visible
    objectRef: "p.oxd-text:has-text('Password : admin123')"
    expected: "Password : admin123"
  - id: 3c5ed645-c390-4c18-8df4-363ddbd01cd0
    keyword: type-text
    description: Enter valid username
    objectRef: input[name='username']
    input: Admin
  - id: 743b685d-f738-49e1-a15f-8846ae8c80c1
    keyword: type-text
    description: Enter valid password
    objectRef: input[name='password']
    input: admin123
  - id: 9f5e1653-6804-4299-b247-58e69d2fcc75
    keyword: click
    description: Submit login form
    objectRef: button[type='submit']
  - id: f8573f3d-f539-45c2-a0c6-ae89cc3729e3
    keyword: wait-for-visible
    description: Dashboard loads
    objectRef: h6:has-text('Dashboard')
    timeout: 15000
  - id: c6ec65a4-1249-41aa-a791-150595c317a6
    keyword: assert-url-contains
    description: User lands on dashboard URL
    input: /web/index.php/dashboard/index
  - id: cc99d12c-d669-486c-96b5-ce8a4baa91a6
    keyword: assert-text
    description: Dashboard header shown
    objectRef: h6
    expected: Dashboard
