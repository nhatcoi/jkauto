schemaVersion: 1
id: 5bcfb8e1-ccb9-458a-b739-9693fb12904b
name: OrangeHRM Login - Forgot Password Analysis
description: Verify Forgot Password link opens reset password request flow and
  reset form components are visible.
runner: playwright
steps:
  - id: 5e4091c4-42f8-44c5-a743-aa5ed414fb7b
    keyword: navigate-to
    description: Open OrangeHRM login page
    input: https://opensource-demo.orangehrmlive.com/web/index.php/auth/login
  - id: 85903e7d-f305-4175-a189-01b707cec378
    keyword: wait-for-visible
    description: Login form visible
    objectRef: form.oxd-form
    timeout: 15000
  - id: 9f72d894-883a-4fd6-b0e0-a92fbdaa84cd
    keyword: assert-visible
    description: Forgot password link visible
    objectRef: p:has-text('Forgot your password?')
  - id: 1d32c87c-a678-4578-b9ba-b4e07b278c12
    keyword: click
    description: Open forgot password flow
    objectRef: p:has-text('Forgot your password?')
  - id: 197577a5-3a1c-4b83-bedd-a0558d84f4af
    keyword: wait-for-visible
    description: Reset password page visible
    objectRef: h6:has-text('Reset Password')
    timeout: 15000
  - id: e78bcd73-5b41-4300-8b9a-7beeb711eaeb
    keyword: assert-url-contains
    description: User lands on request password reset URL
    input: /web/index.php/auth/requestPasswordResetCode
  - id: 56cf0212-4aa0-4ecb-ac0d-a0d4a66e0047
    keyword: assert-visible
    description: Reset username field visible
    objectRef: input[name='username']
  - id: a8cc9dc8-9c4c-4ba3-80be-939aa82d89a7
    keyword: assert-visible
    description: Cancel button visible
    objectRef: button:has-text('Cancel')
  - id: 04748540-36fa-4d6d-9270-0c0dca9f9571
    keyword: type-text
    description: Enter username for reset request
    objectRef: input[name='username']
    input: Admin
  - id: b8060c2a-419d-439f-bcb2-d02402ad23e7
    keyword: click
    description: Submit reset password request
    objectRef: button[type='submit']
  - id: f7532805-cd54-4ed7-ba8a-25250fe588a0
    keyword: wait-for-visible
    description: Reset password confirmation page visible
    objectRef: h6:has-text('Reset Password link sent successfully')
    timeout: 15000
  - id: 69c9f92b-3086-477e-bb72-13616754d726
    keyword: assert-text
    description: Reset password confirmation title shown
    objectRef: h6
    expected: Reset Password link sent successfully
