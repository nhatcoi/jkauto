id: 3d1818fd-ce9a-4f34-bab9-dbae4c4cb24c
name: OrangeHRM Login - Invalid Credentials Analysis
description: Verify invalid login credentials show validation message and user
  stays on Login page. Scenario covers negative credential flow from Login
  analysis.
schemaVersion: 1
steps:
  - keyword: navigate-to
    description: Open OrangeHRM login page
    input: https://opensource-demo.orangehrmlive.com/web/index.php/auth/login
    enabled: true
    continueOnFailure: false
    timeout: null
  - keyword: wait-for-visible
    description: Login form visible
    objectRef: form.oxd-form
    enabled: true
    continueOnFailure: false
    timeout: 15000
  - keyword: assert-visible
    description: Username field visible
    objectRef: input[name='username']
    enabled: true
    continueOnFailure: false
    timeout: null
  - keyword: assert-visible
    description: Password field visible
    objectRef: input[name='password']
    enabled: true
    continueOnFailure: false
    timeout: null
  - keyword: type-text
    description: Enter invalid username
    objectRef: input[name='username']
    input: WrongUser
    enabled: true
    continueOnFailure: false
    timeout: null
  - keyword: type-text
    description: Enter invalid password
    objectRef: input[name='password']
    input: WrongPass123!
    enabled: true
    continueOnFailure: false
    timeout: null
  - keyword: click
    description: Submit login form
    objectRef: button[type='submit']
    enabled: true
    continueOnFailure: false
    timeout: null
  - keyword: wait-for-visible
    description: Invalid credentials alert visible
    objectRef: .oxd-alert-content-text:has-text('Invalid credentials')
    enabled: true
    continueOnFailure: false
    timeout: 15000
  - keyword: assert-text
    description: Invalid credentials message shown
    objectRef: .oxd-alert-content-text
    expected: Invalid credentials
    enabled: true
    continueOnFailure: false
    timeout: null
  - keyword: assert-url-contains
    description: User remains on login URL
    input: /web/index.php/auth/login
    enabled: true
    continueOnFailure: false
    timeout: null
createdAt: 2026-06-18T19:05:39.027Z
updatedAt: 2026-06-18T19:05:51.381Z
