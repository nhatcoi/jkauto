id: d48e17ca-f195-4db8-97f0-c3576fcdfea9
name: OrangeHRM Login - Valid Credentials Analysis
description: Verify valid login flow for OrangeHRM demo and confirm user reaches
  Dashboard. Scenario covers positive login business flow from Login analysis.
schemaVersion: 1
steps:
  - keyword: navigate-to
    description: Open OrangeHRM login page
    input: https://opensource-demo.orangehrmlive.com/web/index.php/auth/login
    enabled: true
    continueOnFailure: false
    timeout: null
  - keyword: wait-for-visible
    description: Login form visible
    objectRef: form.oxd-form
    enabled: true
    continueOnFailure: false
    timeout: 15000
  - keyword: assert-visible
    description: Username field visible
    objectRef: input[name='username']
    enabled: true
    continueOnFailure: false
    timeout: null
  - keyword: assert-visible
    description: Password field visible
    objectRef: input[name='password']
    enabled: true
    continueOnFailure: false
    timeout: null
  - keyword: type-text
    description: Enter valid username
    objectRef: input[name='username']
    input: Admin
    enabled: true
    continueOnFailure: false
    timeout: null
  - keyword: type-text
    description: Enter valid password
    objectRef: input[name='password']
    input: admin123
    enabled: true
    continueOnFailure: false
    timeout: null
  - keyword: click
    description: Submit login form
    objectRef: button[type='submit']
    enabled: true
    continueOnFailure: false
    timeout: null
  - keyword: wait-for-visible
    description: Dashboard header visible
    objectRef: h6:has-text('Dashboard')
    enabled: true
    continueOnFailure: false
    timeout: 15000
  - keyword: assert-url-contains
    description: User lands on dashboard URL
    input: /web/index.php/dashboard/index
    enabled: true
    continueOnFailure: false
    timeout: null
  - keyword: assert-text
    description: Dashboard header shown
    objectRef: h6
    expected: Dashboard
    enabled: true
    continueOnFailure: false
    timeout: null
createdAt: 2026-06-18T19:06:25.053Z
updatedAt: 2026-06-18T19:06:35.101Z
