id: 6192b30a-8f55-4b03-83b5-76341eda96cb
name: OrangeHRM Login - Security Edge Analysis
description: "Verify login security and edge-case behavior: password masking,
  SQL injection-like input rejection, XSS-like input rejection, and user remains
  on Login page after invalid malicious inputs."
schemaVersion: 1
steps:
  - keyword: navigate-to
    description: Open OrangeHRM login page
    input: https://opensource-demo.orangehrmlive.com/web/index.php/auth/login
    enabled: true
    continueOnFailure: false
    timeout: null
  - keyword: wait-for-visible
    description: Login form visible
    objectRef: form.oxd-form
    enabled: true
    continueOnFailure: false
    timeout: 15000
  - keyword: type-text
    description: Enter SQL injection-like username payload
    objectRef: input[name='username']
    input: "' OR '1'='1"
    enabled: true
    continueOnFailure: false
    timeout: null
  - keyword: type-text
    description: Enter SQL injection-like password payload
    objectRef: input[name='password']
    input: "' OR '1'='1"
    enabled: true
    continueOnFailure: false
    timeout: null
  - keyword: click
    description: Submit login form with injection-like payload
    objectRef: button[type='submit']
    enabled: true
    continueOnFailure: false
    timeout: null
  - keyword: wait-for-visible
    description: Invalid credentials alert visible
    objectRef: .oxd-alert-content-text:has-text('Invalid credentials')
    enabled: true
    continueOnFailure: false
    timeout: 15000
  - keyword: assert-text
    description: Injection-like payload rejected
    objectRef: .oxd-alert-content-text
    expected: Invalid credentials
    enabled: true
    continueOnFailure: false
    timeout: null
  - keyword: assert-url-contains
    description: User remains on login URL
    input: /web/index.php/auth/login
    enabled: true
    continueOnFailure: false
    timeout: null
  - keyword: clear-text
    description: Clear username field
    objectRef: input[name='username']
    enabled: true
    continueOnFailure: false
    timeout: null
  - keyword: clear-text
    description: Clear password field
    objectRef: input[name='password']
    enabled: true
    continueOnFailure: false
    timeout: null
  - keyword: type-text
    description: Enter XSS-like username payload
    objectRef: input[name='username']
    input: <script>alert(1)</script>
    enabled: true
    continueOnFailure: false
    timeout: null
  - keyword: type-text
    description: Enter normal password with XSS username payload
    objectRef: input[name='password']
    input: admin123
    enabled: true
    continueOnFailure: false
    timeout: null
  - keyword: click
    description: Submit login form with XSS-like payload
    objectRef: button[type='submit']
    enabled: true
    continueOnFailure: false
    timeout: null
  - keyword: wait-for-visible
    description: Invalid credentials alert visible after XSS-like payload
    objectRef: .oxd-alert-content-text:has-text('Invalid credentials')
    enabled: true
    continueOnFailure: false
    timeout: 15000
  - keyword: assert-text
    description: XSS-like payload rejected without script execution
    objectRef: .oxd-alert-content-text
    expected: Invalid credentials
    enabled: true
    continueOnFailure: false
    timeout: null
  - keyword: assert-url-contains
    description: User still remains on login URL
    input: /web/index.php/auth/login
    enabled: true
    continueOnFailure: false
    timeout: null
createdAt: 2026-06-18T19:07:07.652Z
updatedAt: 2026-06-18T19:07:22.963Z
