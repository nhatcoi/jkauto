schemaVersion: 1
id: a0b1c2d3-e4f5-6789-abcd-ef0123456701
name: UI — Login with valid credentials
description: >
  Data-driven login test. Runs once per row in ui-login-valid-users.csv (admin,
  editor1, viewer1). Each row logs in and verifies redirect to Dashboard +
  welcome message shows the correct username.
tags:
  - web
  - ui
  - auth
  - smoke
platform: web
runner: playwright
dataFile: data-files/auth-login.csv
steps:
  - id: login-navigate
    keyword: navigate-to
    description: Open login page
    input: ${uiBaseUrl}/login
  - id: login-wait-form
    keyword: wait-for-element
    description: Wait for username input to be ready
    objectRef: "#username"
  - id: login-type-username
    keyword: type-text
    description: Enter username from data row
    objectRef: "#username"
    input: "{{username}}"
  - id: login-type-password
    keyword: type-text
    description: Enter password from data row
    objectRef: "#password"
    input: "{{password}}"
  - id: login-click-submit
    keyword: click
    description: Click Sign in button
    objectRef: "#login-btn"
  - id: login-wait-dashboard
    keyword: wait-for-element
    description: Wait for Dashboard heading to appear
    objectRef: text=Dashboard
  - id: login-assert-url
    keyword: assert-url
    description: URL is dashboard root after login
    expected: ${uiBaseUrl}/
  - id: login-assert-welcome
    keyword: assert-text
    description: Welcome message shows logged-in username
    objectRef: text=Welcome back,
    expected: "{{expected_welcome}}"
