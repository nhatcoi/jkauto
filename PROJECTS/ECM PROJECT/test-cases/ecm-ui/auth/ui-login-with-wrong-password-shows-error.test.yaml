schemaVersion: 1
id: a0b1c2d3-e4f5-6789-abcd-ef0123456702
name: UI — Login with wrong password shows error
description: Entering wrong password shows error banner, user stays on login
  page without being redirected.
tags:
  - web
  - ui
  - auth
  - negative
platform: web
runner: playwright
steps:
  - id: nav-login
    keyword: navigate-to
    description: Open login page
    input: ${uiBaseUrl}/login
  - id: wait-form
    keyword: wait-for-element
    description: Wait for login form to render
    objectRef: "#username"
  - id: type-username
    keyword: type-text
    description: Enter valid username
    objectRef: "#username"
    input: admin
  - id: type-wrong-password
    keyword: type-text
    description: Enter incorrect password
    objectRef: "#password"
    input: wrongpassword_invalid
  - id: click-submit
    keyword: click
    description: Submit the login form
    objectRef: "#login-btn"
  - id: wait-error
    keyword: wait-for-element
    description: Wait for error banner to appear after API responds
    objectRef: text=Login failed
  - id: assert-error-visible
    keyword: assert-visible
    description: Error banner is visible on screen
    objectRef: text=Login failed
  - id: assert-still-on-login
    keyword: assert-url
    description: Browser did not redirect — still on /login
    expected: ${uiBaseUrl}/login
