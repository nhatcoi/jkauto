schemaVersion: 1
id: a0b1c2d3-e4f5-6789-abcd-ef0123456705
name: "UI — Register with mismatched passwords shows error"
description: When confirm password differs from password, client-side validation shows "Passwords do not match" and does not submit.
tags:
  - web
  - ui
  - auth
  - register
  - negative
  - validation
platform: web
runner: playwright
steps:
  - id: nav-register
    keyword: navigate-to
    description: Open register page
    input: ${uiBaseUrl}/register

  - id: wait-form
    keyword: wait-for-element
    description: Wait for form
    objectRef: "#reg-username"

  - id: type-username
    keyword: type-text
    description: Fill username
    objectRef: "#reg-username"
    input: mismatchuser

  - id: type-email
    keyword: type-text
    description: Fill email
    objectRef: "#reg-email"
    input: mismatch@example.com

  - id: type-password
    keyword: type-text
    description: Fill password
    objectRef: "#reg-password"
    input: Test@123

  - id: type-confirm-different
    keyword: type-text
    description: Enter a different confirmation password
    objectRef: "#reg-confirm"
    input: Different@456

  - id: click-submit
    keyword: click
    description: Attempt to submit form
    objectRef: "#register-btn"

  - id: wait-error
    keyword: wait-for-element
    description: Wait for error banner
    objectRef: 'text=Passwords do not match'

  - id: assert-error
    keyword: assert-visible
    description: Error message is visible
    objectRef: 'text=Passwords do not match'

  - id: assert-stays-register
    keyword: assert-url
    description: User is not redirected — stays on /register
    expected: ${uiBaseUrl}/register
createdAt: "2026-06-23T00:00:00.000Z"
updatedAt: "2026-06-23T00:00:00.000Z"
